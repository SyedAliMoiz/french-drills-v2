<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Drills V2 — Adaptive</title>

<style>
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --text: #1A1A1A;
  --text-dim: #6B6B6B;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-on: #FFFFFF;
  --accent-faint: #EFF4FF;
  --ok: #16A34A;
  --ok-bg: #E8F5E9;
  --ok-border: #86E8AB;
  --err: #DC2626;
  --err-bg: #FEF2F2;
  --err-border: #FECACA;
  --warn: #D97706;
  --warn-bg: #FFFBEB;
  --warn-border: #FDE68A;
  --line: #E5E5E5;
  --field-bg: #FFFFFF;
  --field-border: #D4D4D4;
  --field-focus: #2563EB;
  --key-bg: #F5F5F5;
  --key-hover: #E5E5E5;
  --key-border: #D4D4D4;
  --key-text: #1A1A1A;
  --bar-track: #E5E5E5;
  --bar-fill: #2563EB;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#191919;--surface:#262626;--text:#F2F2F2;--text-dim:#8A8A8A;
  --accent:#3B82F6;--accent-hover:#60A5FA;--accent-on:#FFFFFF;--accent-faint:#1E293B;
  --ok:#4ADE80;--ok-bg:#14291E;--ok-border:#166534;
  --err:#F87171;--err-bg:#2D1515;--err-border:#7F1D1D;
  --warn:#FBBF24;--warn-bg:#2D2410;--warn-border:#854D0E;
  --line:#333333;--field-bg:#1F1F1F;--field-border:#404040;--field-focus:#3B82F6;
  --key-bg:#2A2A2A;--key-hover:#363636;--key-border:#404040;--key-text:#D4D4D4;
  --bar-track:#333333;--bar-fill:#3B82F6;--card-shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#191919;--surface:#262626;--text:#F2F2F2;--text-dim:#8A8A8A;
  --accent:#3B82F6;--accent-hover:#60A5FA;--accent-on:#FFFFFF;--accent-faint:#1E293B;
  --ok:#4ADE80;--ok-bg:#14291E;--ok-border:#166534;
  --err:#F87171;--err-bg:#2D1515;--err-border:#7F1D1D;
  --warn:#FBBF24;--warn-bg:#2D2410;--warn-border:#854D0E;
  --line:#333333;--field-bg:#1F1F1F;--field-border:#404040;--field-focus:#3B82F6;
  --key-bg:#2A2A2A;--key-hover:#363636;--key-border:#404040;--key-text:#D4D4D4;
  --bar-track:#333333;--bar-fill:#3B82F6;--card-shadow:none;
}
:root[data-theme="light"]{
  --bg:#FAFAFA;--surface:#FFFFFF;--text:#1A1A1A;--text-dim:#6B6B6B;
  --accent:#2563EB;--accent-hover:#1D4ED8;--accent-on:#FFFFFF;--accent-faint:#EFF4FF;
  --ok:#16A34A;--ok-bg:#E8F5E9;--ok-border:#86E8AB;
  --err:#DC2626;--err-bg:#FEF2F2;--err-border:#FECACA;
  --warn:#D97706;--warn-bg:#FFFBEB;--warn-border:#FDE68A;
  --line:#E5E5E5;--field-bg:#FFFFFF;--field-border:#D4D4D4;--field-focus:#2563EB;
  --key-bg:#F5F5F5;--key-hover:#E5E5E5;--key-border:#D4D4D4;--key-text:#1A1A1A;
  --bar-track:#E5E5E5;--bar-fill:#2563EB;--card-shadow:0 1px 3px rgba(0,0,0,0.06);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:1.25rem 1rem}
.serif{font-family:Georgia,"Times New Roman",serif}
.hdr{font-size:1.375rem;font-weight:700;letter-spacing:-0.01em}
.sub{font-size:.8125rem;color:var(--text-dim)}
.label{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}
.tabnum{font-variant-numeric:tabular-nums}
.prog-track{height:4px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--bar-fill);border-radius:2px;transition:width .35s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem;box-shadow:var(--card-shadow);margin-bottom:.75rem}
.card-accent{border-left:3px solid var(--accent)}
.card-ok{border-left-color:var(--ok)}
.card-err{border-left-color:var(--err)}
.card-title{font-weight:600;margin-bottom:.25rem}
.card-sub{font-size:.8125rem;color:var(--text-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;font-family:inherit;font-size:1rem;font-weight:600;padding:.75rem 1.5rem;border:none;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--accent);color:var(--accent-on)}
.btn-p:hover:not(:disabled){background:var(--accent-hover)}
.btn-g{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-g:hover:not(:disabled){background:var(--accent-faint)}
.btn-sm{font-size:.875rem;padding:.5rem 1rem}
.btn-ok{background:var(--ok);color:#fff}
.field{width:100%;font-family:Georgia,"Times New Roman",serif;font-size:1.125rem;padding:.75rem;background:var(--field-bg);color:var(--text);border:1.5px solid var(--field-border);border-radius:6px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--field-focus)}
.field:disabled{opacity:.6;cursor:not-allowed}
.field-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.field-err{border-color:var(--err)!important;background:var(--err-bg)!important}
.field-pw{font-family:inherit;font-size:1rem}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:.625rem 0}
.key{font-family:Georgia,serif;font-size:1rem;min-width:38px;height:36px;display:flex;align-items:center;justify-content:center;padding:0 4px;background:var(--key-bg);color:var(--key-text);border:1px solid var(--key-border);border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .1s,transform .08s}
.key:hover{background:var(--key-hover)}
.key:active{transform:scale(.93)}
.key:disabled{opacity:.3;pointer-events:none}
.fb{padding:.875rem;border-radius:6px;font-size:.9375rem;line-height:1.5;margin-top:.75rem}
.fb-ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok)}
.fb-err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err)}
.fb-head{font-weight:700;display:block;margin-bottom:.2rem}
.fb-answer{font-family:Georgia,serif;font-weight:600}
.row{display:flex;align-items:center;gap:.75rem}
.col{display:flex;flex-direction:column;gap:.75rem}
.mt{margin-top:1rem}.mt-sm{margin-top:.5rem}.mb{margin-bottom:1rem}
.center{text-align:center}
.between{justify-content:space-between}
.flex1{flex:1}
.dash-section{margin-bottom:1.25rem}
.dash-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.5rem;padding-left:.25rem}
.stat-row{display:flex;gap:.5rem;flex-wrap:wrap}
.stat-box{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem;text-align:center}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-label{font-size:.6875rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:.125rem}
.dp{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.dp-top{padding:1rem 1.25rem 0;width:100%;max-width:800px;margin:0 auto}
.dp-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.5rem 1.25rem 2rem;width:100%;max-width:800px;margin:0 auto;gap:.5rem}
.dp .card{background:transparent;border:none;box-shadow:none;padding:0;border-radius:0;border-left:none;margin:0}
.dp .card.card-ok{background:var(--ok-bg);border-radius:24px;padding:1.5rem;margin:-.5rem;margin-bottom:0}
.dp .card.card-err{background:var(--err-bg);border-radius:24px;padding:1.5rem;margin:-.5rem;margin-bottom:0}
.dp .serif{font-size:1.75rem;line-height:1.45;color:#F2F2F2;font-weight:700}
.dp .sub{font-size:1.375rem;line-height:1.5;margin-top:.75rem;color:#CCCCCC;font-weight:500}
@media(prefers-color-scheme:light){.dp .serif{color:#1A1A1A}.dp .sub{color:#555}}
:root[data-theme="light"] .dp .serif{color:#1A1A1A}
:root[data-theme="light"] .dp .sub{color:#555}
.dp .field{font-size:clamp(1.25rem,3vw,1.5rem);padding:1.125rem 1.25rem;border-radius:18px;margin-top:1.25rem}
.dp .keys{gap:10px;margin:.75rem 0;justify-content:center}
.dp .key{min-width:48px;height:48px;font-size:1.25rem;border-radius:14px}
.dp .keys-toggle{background:none;border:none;color:var(--text-dim);font-size:.875rem;cursor:pointer;padding:.5rem;margin-top:.5rem;-webkit-tap-highlight-color:transparent}
.dp .keys-toggle:hover{color:var(--text)}
.dp .btn{padding:1.125rem;font-size:clamp(1.0625rem,2.5vw,1.25rem);border-radius:50px}
.dp .fb{padding:1.25rem 1.375rem;border-radius:20px;font-size:clamp(1rem,2.5vw,1.1875rem);margin-top:1.5rem}
.dp .fb-head{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .fb-answer{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .prog-track{height:3px;border-radius:2px}
.dp-count{font-size:.875rem;color:var(--text-dim);font-variant-numeric:tabular-nums}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.shake{animation:shake .35s ease}
.pop{animation:pop .3s ease}
@media(prefers-reduced-motion:reduce){.shake,.pop{animation:none}.prog-fill{transition:none}}
.hw-prog{display:flex;align-items:center;gap:.5rem;justify-content:center;margin-top:.375rem}
.hw-prog-dots{display:flex;gap:4px}
.hw-prog-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.hw-prog-dot.done{background:var(--ok)}
.hw-prog-dot.active{background:var(--accent)}
.hw-entry-label{font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:.75rem}
.conj-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem}
.conj-label{font-weight:600;font-size:1rem;min-width:5.5rem;text-align:right;color:var(--text-dim);font-family:Georgia,"Times New Roman",serif}
.conj-input{flex:1}
.conj-result{display:flex;align-items:center;gap:.5rem;margin-top:.25rem;font-size:.875rem}
.conj-correct{color:var(--ok);font-weight:600}
.conj-wrong{color:var(--err)}
.conj-answer{font-weight:600;font-family:Georgia,serif}
.hw-form-row{margin-bottom:1rem}
.hw-form-label{font-size:.875rem;font-weight:600;color:var(--text-dim);margin-bottom:.375rem;display:block}
.hw-summary-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.hw-summary-word{font-family:Georgia,serif;font-weight:700;font-size:1.125rem;margin-bottom:.5rem}
.hw-summary-row{display:flex;justify-content:space-between;font-size:.875rem;padding:.25rem 0;border-bottom:1px solid var(--line)}
.hw-summary-row:last-child{border-bottom:none}
.streak-badge{display:inline-flex;align-items:center;gap:.375rem;font-size:.875rem;font-weight:700;color:var(--warn);padding:.25rem .75rem;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:99px}
.hw-history{margin-top:1rem;text-align:left;width:100%}
.hw-history-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.5rem}
.hw-history-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--line);font-size:.875rem}
.hw-history-row:last-child{border-bottom:none}
.hw-history-date{color:var(--text-dim)}
.hw-history-score{font-weight:700;font-variant-numeric:tabular-nums}
.hw-history-bar{flex:1;margin:0 .75rem;height:4px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.hw-history-fill{height:100%;border-radius:2px}
.res-score{font-family:Georgia,serif;font-size:3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.res-msg{font-size:1.125rem;color:var(--text-dim);margin-bottom:1.5rem}
.auth-logo{font-size:2rem;margin-bottom:.25rem}
.auth-title{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;margin-bottom:.25rem}
.auth-sub{color:var(--text-dim);font-size:.875rem;margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:.375rem;color:var(--text-dim)}
.form-help{font-size:.75rem;color:var(--text-dim);margin-top:.25rem}
.error-msg{color:var(--err);font-size:.875rem;font-weight:500;margin-bottom:.75rem}
.checkbox-row{display:flex;align-items:center;gap:.5rem;font-size:.875rem;margin:.75rem 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.checkbox-row input{width:18px;height:18px;accent-color:var(--accent)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-bar{height:6px;border-radius:3px;background:var(--bar-track);overflow:hidden;margin-top:.25rem}
.err-bar-fill{height:100%;border-radius:3px;background:var(--err);transition:width .3s}
.srs-badge{display:inline-block;font-size:.6875rem;font-weight:600;padding:.125rem .5rem;border-radius:99px}
.srs-new{background:var(--accent-faint);color:var(--accent)}
.srs-due{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}
.srs-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
</style>
</head>

/* ═══════════════════════════════════════════════════════════════
   CRYPTO — AES-256-GCM password encryption for PAT
   ═══════════════════════════════════════════════════════════════ */

const Cry = {
  async deriveKey(pw, salt) {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' }, raw, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  },
  async encrypt(pw, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(pw, salt);
    const enc = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { s: this.b64(salt), i: this.b64(iv), d: this.b64(new Uint8Array(enc)) };
  },
  async decrypt(pw, bundle) {
    const salt = this.unb64(bundle.s), iv = this.unb64(bundle.i), data = this.unb64(bundle.d);
    const key = await this.deriveKey(pw, salt);
    const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(dec);
  },
  b64(u8) { return btoa(String.fromCharCode.apply(null, u8)); },
  unb64(s) { return new Uint8Array(atob(s).split('').map(function(c){return c.charCodeAt(0);})); }
};


/* ═══════════════════════════════════════════════════════════════
   GITHUB API
   ═══════════════════════════════════════════════════════════════ */

class GH {
  constructor(token) { this.token = token; this.api = 'https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+'/contents'; this.shas = {}; }
  headers() { var h = {'Accept':'application/vnd.github.v3+json'}; if (this.token) h['Authorization'] = 'Bearer '+this.token; return h; }
  encodePath(path) { return path.split('/').map(function(s){return encodeURIComponent(s);}).join('/'); }
  async get(path) {
    var r = await fetch(this.api+'/'+this.encodePath(path), {headers:this.headers()});
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub '+r.status+': '+(await r.json()).message);
    var d = await r.json(); this.shas[path] = d.sha;
    var bin = atob(d.content.replace(/\n/g, ''));
    return new TextDecoder().decode(new Uint8Array([].map.call(bin, function(c){return c.charCodeAt(0);})));
  }
  async put(path, content, msg) {
    var bytes = new TextEncoder().encode(content);
    var b64 = btoa(String.fromCharCode.apply(null, bytes));
    var body = { message:msg, content:b64 };
    if (this.shas[path]) body.sha = this.shas[path];
    var r = await fetch(this.api+'/'+this.encodePath(path), { method:'PUT', headers:Object.assign({},this.headers(),{'Content-Type':'application/json'}), body:JSON.stringify(body) });
    if (!r.ok) {
      var e = await r.json();
      if (r.status === 409 && !this.shas[path]) { await this.get(path); return this.put(path, content, msg); }
      throw new Error('GitHub '+r.status+': '+e.message);
    }
    var d = await r.json(); this.shas[path] = d.content.sha;
  }
}


/* ═══════════════════════════════════════════════════════════════
   FRENCH LANGUAGE ENGINE
   ═══════════════════════════════════════════════════════════════ */

const PRONOUNS = ['je','tu','il/elle/on','nous','vous','ils/elles'];
const IRREG_FEM = {
  'beau':'belle','nouveau':'nouvelle','vieux':'vieille',
  'blanc':'blanche','doux':'douce','faux':'fausse',
  'long':'longue','gros':'grosse','gentil':'gentille',
  'frais':'fraîche','roux':'rousse','favori':'favorite',
  'public':'publique','sec':'sèche','grec':'grecque'
};

const French = {
  conjugateER(inf) {
    var stem = inf.slice(0,-2), isGer = inf.endsWith('ger'), isCer = inf.endsWith('cer');
    var endings = ['e','es','e','ons','ez','ent'], forms = {};
    PRONOUNS.forEach(function(p, i) {
      var s = stem;
      if (i === 3 && isGer) s = stem + 'e';
      if (i === 3 && isCer) s = stem.slice(0,-1) + 'ç';
      forms[p] = s + endings[i];
    });
    return forms;
  },
  pluralNoun(noun) {
    var n = noun.trim().toLowerCase();
    if (/[sxz]$/.test(n)) return n;
    if (/eau$/.test(n) || /au$/.test(n)) return n + 'x';
    if (n.endsWith('al')) return n.slice(0,-2) + 'aux';
    return n + 's';
  },
  feminizeAdj(adj) {
    var a = adj.trim().toLowerCase();
    if (IRREG_FEM[a]) return IRREG_FEM[a];
    if (a.endsWith('e') && !a.endsWith('é')) return a;
    if (a.endsWith('eux')) return a.slice(0,-3) + 'euse';
    if (a.endsWith('oux')) return a.slice(0,-3) + 'ouse';
    if (a.endsWith('if')) return a.slice(0,-2) + 'ive';
    if (a.endsWith('er')) return a.slice(0,-2) + 'ère';
    if (/(?:el|eil)$/.test(a)) return a + 'le';
    if (/(?:ien|en)$/.test(a)) return a + 'ne';
    if (a.endsWith('on')) return a + 'ne';
    if (a.endsWith('et')) return a + 'te';
    return a + 'e';
  },
  pluralAdj(adj) {
    var a = adj.trim().toLowerCase();
    if (/[sx]$/.test(a)) return a;
    if (a.endsWith('eau')) return a + 'x';
    if (a.endsWith('al')) return a.slice(0,-2) + 'aux';
    return a + 's';
  }
};


/* ═══════════════════════════════════════════════════════════════
   SRS ENGINE — SM-2 spaced repetition per word
   ═══════════════════════════════════════════════════════════════ */

const SRS = {
  defaultCard(type) {
    var errors;
    if (type === 'verb') errors = {je:0,tu:0,il:0,nous:0,vous:0,ils:0,sentence:0};
    else if (type === 'noun') errors = {article:0,plural:0,sentence:0};
    else errors = {feminine:0,mascPlural:0,femPlural:0,sentence:0};
    return {ef:2.5, interval:0, reps:0, nextReview:null, lastReview:null, errors:errors};
  },

  update(card, grade) {
    var today = todayStr();
    card.lastReview = today;
    if (grade >= 3) {
      if (card.reps === 0) card.interval = 1;
      else if (card.reps === 1) card.interval = 3;
      else card.interval = Math.round(card.interval * card.ef);
      card.ef = Math.max(1.3, card.ef + 0.1 - (5-grade) * (0.08 + (5-grade)*0.02));
      card.reps++;
    } else {
      card.reps = 0;
      card.interval = 1;
    }
    var d = new Date(today + 'T00:00:00');
    d.setDate(d.getDate() + card.interval);
    card.nextReview = d.toISOString().slice(0,10);
    return card;
  },

  isDue(card) {
    if (!card.nextReview) return true;
    return card.nextReview <= todayStr();
  },

  daysOverdue(card) {
    if (!card.nextReview) return 999;
    var diff = Math.floor((new Date(todayStr()+'T00:00:00') - new Date(card.nextReview+'T00:00:00')) / 86400000);
    return Math.max(0, diff);
  },

  errorWeight(card) {
    if (!card.errors) return 0;
    var sum = 0;
    for (var k in card.errors) sum += card.errors[k];
    return sum;
  },

  gradeFromPct(pct) {
    if (pct >= 1.0) return 5;
    if (pct >= 0.8) return 4;
    if (pct >= 0.6) return 3;
    if (pct >= 0.4) return 2;
    if (pct >= 0.2) return 1;
    return 0;
  }
};

/* ═══════════════════════════════════════════════════════════════
   SESSION BUILDER — adaptive word selection
   ═══════════════════════════════════════════════════════════════ */

function shuffle(arr) {
  for (var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}

function pickWords(type, count) {
  var words = ALL_WORDS.filter(function(w){return w.type === type;});
  var dueWithErrors = [], dueClean = [], fresh = [];
  for (var i=0; i<words.length; i++) {
    var w = words[i], card = getCard(w.id);
    if (!card.lastReview) { fresh.push(w); continue; }
    if (!SRS.isDue(card)) continue;
    if (SRS.errorWeight(card) > 0) dueWithErrors.push(w);
    else dueClean.push(w);
  }
  dueWithErrors.sort(function(a,b) {
    return SRS.errorWeight(getCard(b.id)) - SRS.errorWeight(getCard(a.id));
  });
  fresh.sort(function(a, b) {
    var order = INTRO_ORDER[a.type];
    if (!order) return 0;
    var ai = order.indexOf(a.setIdx), bi = order.indexOf(b.setIdx);
    return ai !== bi ? ai - bi : a.wordIdx - b.wordIdx;
  });
  var result = dueWithErrors.slice(0, count);
  if (result.length < count) result = result.concat(fresh.slice(0, count - result.length));
  if (result.length < count) result = result.concat(dueClean.slice(0, count - result.length));
  if (result.length < count) {
    var used = {};
    result.forEach(function(w){used[w.id]=true;});
    var rest = words.filter(function(w){return !used[w.id] && getCard(w.id).lastReview && !SRS.isDue(getCard(w.id));});
    rest.sort(function(a,b){return (getCard(a.id).nextReview||'9999').localeCompare(getCard(b.id).nextReview||'9999');});
    result = result.concat(rest.slice(0, count - result.length));
  }
  return result;
}

function todayStr() { return new Date().toISOString().slice(0,10); }

function normApostrophe(s) { return s.replace(/[''ʼ`′]/g, "'"); }

function accentMatch(a, b) {
  if (a === b) return true;
  var strip = function(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'');};
  return strip(a) === strip(b);
}

function needsElision(form) { return /^[aeéèêëiîïoôuùûyh]/i.test(form); }

function pronounLabel(pronoun, form) {
  if (pronoun === 'je' && needsElision(form)) return "j'";
  return pronoun;
}

function formatDuration(ms) {
  var secs = Math.floor(ms/1000);
  if (secs < 60) return secs + 's';
  var mins = Math.floor(secs/60); secs = secs % 60;
  return mins + 'm ' + (secs<10?'0':'') + secs + 's';
}

function getStreak() {
  if (!S.progress) return 0;
  var hw = S.progress.hw || {};
  var today = todayStr(), streak = 0;
  var d = new Date(today+'T00:00:00');
  if (hw[today] && hw[today].complete) { streak = 1; d.setDate(d.getDate()-1); }
  else { d.setDate(d.getDate()-1); }
  while (true) {
    var key = d.toISOString().slice(0,10);
    if (hw[key] && hw[key].complete) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function renderStreakBadge() {
  var streak = getStreak();
  if (streak === 0) return '';
  return '<div class="streak-badge">' + streak + ' day streak</div>';
}

function hintLevel() {
  var completed = Object.values(S.progress.hw || {}).filter(function(h){return h.complete;}).length;
  if (completed <= 4) return 0;
  if (completed <= 9) return 1;
  return 2;
}

async function doSetup() {
  var pw1=$('pw1').value, pw2=$('pw2').value, pat=$('pat').value;
  S.error = null;
  if (!pw1 || pw1.length < 4) { S.error='Password must be at least 4 characters.'; render(); return; }
  if (pw1 !== pw2) { S.error="Passwords don't match."; render(); return; }
  if (!pat || !pat.startsWith('github_pat_')) { S.error='Please enter a valid fine-grained PAT.'; render(); return; }
  $('setup-btn').disabled = true;
  $('setup-btn').innerHTML = '<span class="spin"></span> Setting up...';
  try {
    var gh = new GH(pat);
    try { await gh.get('README.md'); } catch(e) {}
    var enc = await Cry.encrypt(pw1, pat);
    await gh.put('config.enc', JSON.stringify(enc), 'Setup: encrypted config');
    var prog = defaultProgress(); prog.updated = new Date().toISOString();
    await gh.put('V2-PROGRESS.json', JSON.stringify(prog,null,2), 'Setup: initial progress');
    localStorage.setItem('fdv2_token', pat);
    localStorage.setItem('fd2_setup', '1');
    S.gh = gh; S.progress = prog; S.error = null;

async function doLogin() {
  var pw = $('pw').value;
  S.error = null;
  if (!pw) { S.error = 'Enter your password.'; render(); return; }
  $('login-btn').disabled = true;
  $('login-btn').innerHTML = '<span class="spin"></span> Unlocking...';
  try {
    var gh = new GH(null);
    var raw = await gh.get('config.enc');
    if (!raw) { S.error='No config found in the french-drills repo. Make sure V1 is set up first.'; render(); return; }
    var bundle = JSON.parse(raw), pat;
    try { pat = await Cry.decrypt(pw, bundle); } catch(e) { S.error='Wrong password.'; render(); return; }
    gh.token = pat;
    if ($('remember').checked) localStorage.setItem('fdv2_token', pat);
    var progRaw = await gh.get('V2-PROGRESS.json');
    var prog = progRaw ? JSON.parse(progRaw) : defaultProgress();
    S.gh = gh; S.progress = prog; S.error = null;
    var local = localStorage.getItem('fdv2_progress');
    if (local) { var lp = JSON.parse(local); if (lp.updated && (!S.progress.updated || lp.updated > S.progress.updated)) S.progress = lp; }
    S.screen = 'dashboard'; render();
  } catch(e) { S.error = 'Login failed: '+e.message; render(); }
}

function startHWMode() {
  var today = todayStr();
  var existing = S.progress && S.progress.hw && S.progress.hw[today];

  S.screen = 'hw';
  S.hwStep = 0;
  if (!S.sessionStartTime) S.sessionStartTime = Date.now();

  if (existing && !existing.complete && existing.wordIds) {
    S.hwSession = {
      verbs: existing.wordIds.verbs.map(function(id){return WORD_MAP[id];}),
      nouns: existing.wordIds.nouns.map(function(id){return WORD_MAP[id];}),
      adj: existing.wordIds.adj.map(function(id){return WORD_MAP[id];})
    };
    S.hwWords = {
      verbs: S.hwSession.verbs.map(function(w){return w.word;}),
      nouns: S.hwSession.nouns.map(function(w){return {w:w.word, g:w.gender};}),
      adjectives: S.hwSession.adj.map(function(w){return w.word;})
    };
    S.hwStep = existing.lastStep || 0;
    S.hwResults = existing.results || {verbs:[],nouns:[],adjectives:[],sentences:[]};
    S.hwChecked = existing.checked || {};
    S.hwResponseCount = existing.responses || 0;
    S.hwStartTime = existing.startedAt || null;
  } else {
    var session = buildSession();
    S.hwSession = session;
    S.hwWords = {
      verbs: session.verbs.map(function(w){return w.word;}),
      nouns: session.nouns.map(function(w){return {w:w.word, g:w.gender};}),
      adjectives: session.adj.map(function(w){return w.word;})
    };
    S.hwResults = {verbs:[],nouns:[],adjectives:[],sentences:[]};
    S.hwChecked = {};
    S.hwResponseCount = 0;
    S.hwStartTime = null;
    S.sessionErrors = {};
    S.sessionMistakes = {};
    S.lessonQueue = [];
    S.shownLessons = {};
  }
  render();
}

function checkHWVerb(idx) {
  if (!S.hwStartTime) S.hwStartTime = new Date().toISOString();
  S.hwResponseCount++;
  var verb = S.hwWords.verbs[idx];
  var correct = French.conjugateER(verb);
  var forms = {}, scoreCorrect = 0;
  var wordData = S.hwSession.verbs[idx];
  var card = getCard(wordData.id);

  PRONOUNS.forEach(function(p, i) {
    var typed = normApostrophe(($('conj'+i)?$('conj'+i).value:'').trim().toLowerCase().normalize('NFC'));
    var rawForm = correct[p].normalize('NFC');
    var displayCorrect = correct[p];
    var ok = accentMatch(typed, rawForm);
    if (p === 'je' && needsElision(rawForm)) {
      var elided = ("j'"+rawForm).normalize('NFC');
      displayCorrect = "j'"+correct[p];
      if (accentMatch(typed, elided)) ok = true;
    }
    if (ok) scoreCorrect++;
    else {
      var errKey = ['je','tu','il','nous','vous','ils'][i];
      card.errors[errKey] = (card.errors[errKey]||0) + 1;
      trackSessionError('conj_' + errKey, typed, displayCorrect, verb);
    }
    forms[p] = {typed:typed, correct:displayCorrect, ok:ok};
  });

  setCard(wordData.id, card);
  S.hwChecked['v'+idx] = {forms:forms, score:{total:6, correct:scoreCorrect}};
  S.hwResults.verbs[idx] = {word:verb, forms:forms, score:{total:6, correct:scoreCorrect}};
  saveHWState(); render();
}

function checkHWWordSentences(type, wordIdx) {
  if (!S.hwStartTime) S.hwStartTime = new Date().toISOString();
  S.hwResponseCount++;
  var typeKey = type === 'adj' ? 'adj' : type;
  var wordData = S.hwSession[typeKey][wordIdx];
  var items = wordData.sentences;
  var keyPrefix = type === 'verbs' ? 'sv' : type === 'nouns' ? 'sn' : 'sa';
  var checkedKey = keyPrefix + wordIdx;
  var strip = function(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'');};
  var norm = function(s){return normApostrophe(s.trim().toLowerCase().normalize('NFC').replace(/\s+/g,' ').replace(/[.!?,;…]+$/,''));};
  var match = function(a,b){return a===b || strip(a)===strip(b);};

  var results = [], scoreCorrect = 0;
  var card = getCard(wordData.id);

  for (var si=0; si<items.length; si++) {
    var typed = norm($('sent-'+si)?$('sent-'+si).value:'');
    var expected = norm(items[si].fr);
    var ok = match(typed, expected);
    if (!ok && items[si].alt) {
      for (var ai=0; ai<items[si].alt.length; ai++) {
        if (match(typed, norm(items[si].alt[ai]))) { ok=true; break; }
      }
    }
    if (ok) scoreCorrect++;
    else card.errors.sentence = (card.errors.sentence||0) + 1;
    results.push({typed:typed, correct:items[si].fr, ok:ok, en:items[si].en});
  }

  setCard(wordData.id, card);
  S.hwChecked[checkedKey] = {items:results, score:{total:2,correct:scoreCorrect}};
  S.hwResults.sentences[type+wordIdx] = {category:type, items:results, score:{total:2,correct:scoreCorrect}};
  saveHWState(); syncHWFile(); render();
}

function hwNext() {
  S.hwStep++; if(S.hwStep>18) S.hwStep=19;
  saveHWState(); syncHWFile();
  if (S.lessonQueue.length > 0) { renderLesson(S.lessonQueue.shift()); return; }
  render();
}

function bindEnterAdvance() {
  var armed = false;
  document.addEventListener('keyup', function onUp(e) {
    if (e.key === 'Enter') { armed = true; document.removeEventListener('keyup', onUp); }
  });
  setTimeout(function() { armed = true; }, 600);
  var handler = function(e) {
    if (e.key === 'Enter' && armed && !e.repeat) {
      document.removeEventListener('keydown', handler);
      hwNext();
    }
  };
  document.addEventListener('keydown', handler);
}

function updateSRSAfterSession() {
  var html = '', types = ['verbs','nouns','adj'];
  types.forEach(function(typeKey) {
    for (var i=0; i<3; i++) {
      var wordData = S.hwSession[typeKey][i];
      if (!wordData) continue;
      var correct=0, total=0;
      var checkKey = typeKey==='verbs'?'v':typeKey==='nouns'?'n':'a';
      var sentKey = typeKey==='verbs'?'sv':typeKey==='nouns'?'sn':'sa';
      var ck = S.hwChecked[checkKey+i];
      if (ck) { correct+=ck.score.correct; total+=ck.score.total; }
      var sk = S.hwChecked[sentKey+i];
      if (sk) { correct+=sk.score.correct; total+=sk.score.total; }
      if (total === 0) continue;

      var pct = correct/total;
      var grade = SRS.gradeFromPct(pct);
      var card = getCard(wordData.id);
      var oldInterval = card.interval;
      SRS.update(card, grade);
      setCard(wordData.id, card);

      var arrow = card.interval > oldInterval ? '↑' : card.interval < oldInterval ? '↓' : '→';
      var color = grade >= 4 ? 'var(--ok)' : grade >= 3 ? 'var(--accent)' : 'var(--err)';
      html += '<div class="hw-summary-row">' +
        '<span style="font-weight:600">'+esc(wordData.word)+'</span>' +
        '<span style="color:'+color+'">'+correct+'/'+total+'</span>' +
        '<span style="color:var(--text-dim)">'+arrow+' '+card.interval+'d</span>' +
      '</div>';
    }
  });
  return html ? '<div class="hw-summary-card" style="border-left:3px solid var(--accent)">'+html+'</div>' : '';
}

function hwFileName() {
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var d = new Date();
  var completed = Object.values(S.progress.hw||{}).filter(function(h){return h.complete;}).length;
  return 'homework-v2/Homework '+(completed+1)+' ('+months[d.getMonth()]+' '+d.getDate()+').md';
}

function generateHWMarkdown() {
  var md = '';
  for (var i=0; i<3; i++) {
    var vc = S.hwChecked['v'+i];
    var verb = S.hwWords.verbs[i];
    var conj = French.conjugateER(verb);
    md += '### '+verb+'\n\n';
    PRONOUNS.forEach(function(p, pi) {
      var lbl = pronounLabel(p, conj[p]);
      var val = vc&&vc.forms[p] ? vc.forms[p].typed : '';
      md += '|'+lbl+'|'+(val||'')+'|\n';
      if (pi===0) md += '|---|---|\n';
    });
    md += '\n';
  }
  for (var i=0; i<3; i++) {
    var nc = S.hwChecked['n'+i];
    var noun = S.hwWords.nouns[i];
    var gLabel = noun.g==='f'?'feminine':'masculine';
    md += '### '+noun.w+'\n\n|'+gLabel+'|'+(nc&&nc.article?nc.article.typed:'')+'|\n|---|---|\n|plural|'+(nc&&nc.plural?nc.plural.typed:'')+'|\n\n';
  }
  for (var i=0; i<3; i++) {
    var ac = S.hwChecked['a'+i];
    var adj = S.hwWords.adjectives[i];
    md += '### '+adj+'\n\n|masculine|'+adj+'|\n|---|---|\n|feminine|'+(ac&&ac.fem?ac.fem.typed:'')+'|\n|masc. plural|'+(ac&&ac.mascPl?ac.mascPl.typed:'')+'|\n|fem. plural|'+(ac&&ac.femPl?ac.femPl.typed:'')+'|\n\n';
  }
  var sentCats = [{name:'Verb Sentences',key:'verbs',prefix:'sv'},{name:'Noun Phrases',key:'nouns',prefix:'sn'},{name:'Adjective Phrases',key:'adj',prefix:'sa'}];
  sentCats.forEach(function(cat) {
    md += '### '+cat.name+'\n\n|English|French|\n|---|---|\n';
    for (var wi=0; wi<3; wi++) {
      var sc = S.hwChecked[cat.prefix+wi];
      var wordData = S.hwSession[cat.key][wi];
      if (wordData && wordData.sentences) {
        wordData.sentences.forEach(function(sent, si) {
          var val = sc&&sc.items&&sc.items[si] ? sc.items[si].typed : '';
          md += '|'+sent.en+'|'+val+'|\n';
        });
      }
    }
    md += '\n';
  });
  return md;
}

function downloadHWFile() {
  var md = generateHWMarkdown();
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var d = new Date();
  var completed = Object.values(S.progress.hw||{}).filter(function(h){return h.complete;}).length;
  var name = 'Homework '+completed+' ('+months[d.getMonth()]+' '+d.getDate()+').md';
  var blob = new Blob([md], {type:'text/markdown'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function syncHWFile() {
  if (!S.gh) return;
  try { var md = generateHWMarkdown(); await S.gh.put(hwFileName(), md, 'HW sync — '+todayStr()); }
  catch(e) { console.error('HW file sync failed:', e); }
}

function saveHWState() {

}

function completeHW() {
  var today = todayStr();
  if (!S.progress.hw) S.progress.hw = {};
  var hw = S.progress.hw[today] || {};
  hw.completedAt = new Date().toISOString();
  hw.complete = true;
  hw.startedAt = S.hwStartTime;
  hw.responses = S.hwResponseCount;
  hw.wordIds = S.hwSession ? {
    verbs: S.hwSession.verbs.map(function(w){return w.id;}),
    nouns: S.hwSession.nouns.map(function(w){return w.id;}),
    adj: S.hwSession.adj.map(function(w){return w.id;})
  } : null;
  hw.results = S.hwResults;
  hw.checked = S.hwChecked;

  var total=0, correct=0;
  for (var i=0; i<3; i++) {
    var vc=S.hwChecked['v'+i]; if(vc){total+=vc.score.total;correct+=vc.score.correct;}
    var svc=S.hwChecked['sv'+i]; if(svc){total+=svc.score.total;correct+=svc.score.correct;}
    var nc=S.hwChecked['n'+i]; if(nc){total+=nc.score.total;correct+=nc.score.correct;}
    var snc=S.hwChecked['sn'+i]; if(snc){total+=snc.score.total;correct+=snc.score.correct;}
    var ac=S.hwChecked['a'+i]; if(ac){total+=ac.score.total;correct+=ac.score.correct;}
    var sac=S.hwChecked['sa'+i]; if(sac){total+=sac.score.total;correct+=sac.score.correct;}
  }
  hw.score = {total:total, correct:correct};

  var stats = S.progress.stats;
  stats.questions = (stats.questions||0) + total;
  stats.correct = (stats.correct||0) + correct;
  var td = todayStr();
  if (stats.lastDate !== td) {
    if (stats.lastDate) {
      var diff = Math.floor((new Date(td+'T00:00:00') - new Date(stats.lastDate+'T00:00:00')) / 86400000);
      stats.streak = diff <= 1 ? (stats.streak||0) + 1 : 1;
    } else { stats.streak = 1; }
    stats.lastDate = td;
    if ((stats.streak||0) > (stats.best||0)) stats.best = stats.streak;
  }

  S.progress.hw[today] = hw;
  S.progress.updated = new Date().toISOString();
  localStorage.setItem('fdv2_progress', JSON.stringify(S.progress));
  syncToGitHub();
}

}

      var gh = new GH(storedToken);

      S.progress = raw ? JSON.parse(raw) : defaultProgress();

      S.screen = 'dashboard';

    } catch(e) { localStorage.removeItem('fdv2_token'); }
  }
  S.screen = 'login';
  render();
}

init();
</script>
